<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password</title>
    <link rel="stylesheet" href="css/chng pss copy.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="icon" type="image/icon" href="icon/favicon.ico">
</head> 

<body>
    <header class="header" id="come">   </header>
    <main class="container">
        <div class="info-box">
            <div id="info-panel-container" class="info-panel"></div>
        </div>
        <div class="Preferences" id="chgPas">

        <div class="breadcrumbs">
            <a href="#">Preferences</a> <span>/</span> Change password
        </div>

        <div class="page-title-section">
            <div class="avatar" id="short"></div>
            <h2 id="nameTitle"></h2>
        </div>

        <div id="chgPassbx">
            <div class="alert" id="alertBanner">
                <span>You must change your password to proceed.</span>
                <button class="alert-close" id="alertCloseBtn">&times;</button>
            </div>

            <div class="form-section">
                <h2>Change password</h2>

                <div class="form-group">
                    <div class="form-label">Username</div>
                    <div class="form-content" id="codeDisplay"></div>
                </div>

                <div class="form-group">
                    <div class="form-label"></div>
                    <div class="form-content">
                        <p class="form-text">The password must have at least 5 characters</p>
                    </div>
                </div>

                <!-- Current Password -->
                <div class="form-group">
                    <div class="form-label">
                        Current password
                        <span class="required-icon">!</span>
                    </div>
                    <div class="form-content">
                        <div class="input-wrap" id="wrap-currentPass">
                            <input type="password" id="currentPass" class="form-control" autocomplete="current-password">
                            <div class="iconeye" id="eye-currentPass"><img src="icon/ena.png"></div>
                        </div>
                        <span class="field-error" id="err-currentPass"></span>
                    </div>
                </div>

                <!-- New Password -->
                <div class="form-group">
                    <div class="form-label">
                        New password
                        <span class="required-icon">!</span>
                    </div>
                    <div class="form-content">
                        <div class="input-wrap" id="wrap-newPass">
                            <input type="password" id="newPass" class="form-control" autocomplete="new-password">
                            <div class="iconeye" id="eye-newPass"><img src="icon/ena.png"></div>
                        </div>
                        <span class="field-error" id="err-newPass"></span>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <div class="form-label">
                        New password (again)
                        <span class="required-icon">!</span>
                    </div>
                    <div class="form-content">
                        <div class="input-wrap" id="wrap-confirmPass">
                            <input type="password" id="confirmPass" class="form-control" autocomplete="new-password">
                            <div class="iconeye" id="eye-confirmPass"><img src="icon/ena.png"></div>
                        </div>
                        <span class="field-error" id="err-confirmPass"></span>
                    </div>
                </div>

                <div class="form-repo">
                    <input type="checkbox" checked> 
                    <label>Log out all other browser sessions</label>
                    <span class="required-icon" style="background-color:rgb(6,118,170);">?</span>
                </div>
            </div>

            <button class="btn-save" id="saveBtn">Save changes</button>

            <div class="required-legend">
                <span class="required-icon">!</span> Required
            </div>
        </div>
       
        <div class="success-container">
            <p class="success-text">Password has been changed</p>
            <button class="btn-continue" id="continueToHome">Continue</button>
        </div>
       </div>
    </main>

    <!-- Firebase SDK (must come first) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
<script src="js/info.js"></script>
<script src="js/changepass.js"></script>

</body>
</html>
