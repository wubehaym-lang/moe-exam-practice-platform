<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password</title>
    <link rel="stylesheet" href="css/chng pss copy.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="icon" type="image/icon" href="icon/favicon.ico">
</head> 

<body>
    <header class="header" id="come">   </header>
    <main class="container">
        <div class="info-box">
            <div id="info-panel-container" class="info-panel"></div>
        </div>
        <div class="Preferences" id="chgPas">

        <div class="breadcrumbs">
            <a href="#">Preferences</a> <span>/</span> Change password
        </div>

        <div class="page-title-section">
            <div class="avatar" id="short"></div>
            <h2 id="nameTitle"></h2>
        </div>

        <div id="chgPassbx">
            <div class="alert" id="alertBanner">
                <span>You must change your password to proceed.</span>
                <button class="alert-close" id="alertCloseBtn">&times;</button>
            </div>

            <div class="form-section">
                <h2>Change password</h2>

                <div class="form-group">
                    <div class="form-label">Username</div>
                    <div class="form-content" id="codeDisplay"></div>
                </div>

                <div class="form-group">
                    <div class="form-label"></div>
                    <div class="form-content">
                        <p class="form-text">The password must have at least 5 characters</p>
                    </div>
                </div>

                <!-- Current Password -->
                <div class="form-group">
                    <div class="form-label">
                        Current password
                        <span class="required-icon">!</span>
                    </div>
                    <div class="form-content">
                        <div class="input-wrap" id="wrap-currentPass">
                            <input type="password" id="currentPass" class="form-control" autocomplete="current-password">
                            <div class="iconeye" id="eye-currentPass"><img src="icon/ena.png"></div>
                        </div>
                        <span class="field-error" id="err-currentPass"></span>
                    </div>
                </div>

                <!-- New Password -->
                <div class="form-group">
                    <div class="form-label">
                        New password
                        <span class="required-icon">!</span>
                    </div>
                    <div class="form-content">
                        <div class="input-wrap" id="wrap-newPass">
                            <input type="password" id="newPass" class="form-control" autocomplete="new-password">
                            <div class="iconeye" id="eye-newPass"><img src="icon/ena.png"></div>
                        </div>
                        <span class="field-error" id="err-newPass"></span>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <div class="form-label">
                        New password (again)
                        <span class="required-icon">!</span>
                    </div>
                    <div class="form-content">
                        <div class="input-wrap" id="wrap-confirmPass">
                            <input type="password" id="confirmPass" class="form-control" autocomplete="new-password">
                            <div class="iconeye" id="eye-confirmPass"><img src="icon/ena.png"></div>
                        </div>
                        <span class="field-error" id="err-confirmPass"></span>
                    </div>
                </div>

                <div class="form-repo">
                    <input type="checkbox" checked> 
                    <label>Log out all other browser sessions</label>
                    <span class="required-icon" style="background-color:rgb(6,118,170);">?</span>
                </div>
            </div>

            <button class="btn-save" id="saveBtn">Save changes</button>

            <div class="required-legend">
                <span class="required-icon">!</span> Required
            </div>
        </div>
       
        <div class="success-container">
            <p class="success-text">Password has been changed</p>
            <button class="btn-continue" id="continueToHome">Continue</button>
        </div>
       </div>
    </main>

<script src="js/info.js"></script>
<script>
    loadInfoPanel();
    loadHead();

    // ── Populate user info ─────────────────────────────────────────────────
    const user = JSON.parse(localStorage.getItem("currentUser"));
    if (user) {
        document.getElementById("codeDisplay").innerText = user.username;
        document.getElementById("nameTitle").innerText   = getDisplayName(user.fullName).toUpperCase();
        updateAvatars(user.fullName);
    }

    // ── Alert close button ─────────────────────────────────────────────────
    document.getElementById("alertCloseBtn").addEventListener("click", () => {
        document.getElementById("alertBanner").style.display = "none";
    });

    // ── Helpers ────────────────────────────────────────────────────────────
    function setError(fieldId, message) {
        const input = document.getElementById(fieldId);
        const wrap  = document.getElementById("wrap-" + fieldId);
        const err   = document.getElementById("err-" + fieldId);
        input.classList.add("input-error");
        wrap.classList.add("wrap-error");
        err.textContent  = message;
        err.style.display = "block";
    }

    function clearError(fieldId) {
        const input = document.getElementById(fieldId);
        const wrap  = document.getElementById("wrap-" + fieldId);
        const err   = document.getElementById("err-" + fieldId);
        input.classList.remove("input-error");
        wrap.classList.remove("wrap-error");
        err.textContent  = "";
        err.style.display = "none";
    }

    function clearAllErrors() {
        ["currentPass", "newPass", "confirmPass"].forEach(id => clearError(id));
    }

    // ── Clear error as soon as the user starts typing in that field ────────
    ["currentPass", "newPass", "confirmPass"].forEach(id => {
        document.getElementById(id).addEventListener("input", () => clearError(id));
    });

    // ── Save changes ───────────────────────────────────────────────────────
    document.getElementById("saveBtn").addEventListener("click", function () {
        const currentUser    = JSON.parse(localStorage.getItem("currentUser"));
        const allUsers       = JSON.parse(localStorage.getItem("allUsers"));

        const currentPassVal = document.getElementById("currentPass").value;
        const newPassVal     = document.getElementById("newPass").value;
        const confirmPassVal = document.getElementById("confirmPass").value;

        clearAllErrors();

        let hasError = false;

        // ── 1. Required checks (show all empty fields at once) ─────────────
        if (!currentPassVal) { setError("currentPass", "Required"); hasError = true; }
        if (!newPassVal)      { setError("newPass",     "Required"); hasError = true; }
        if (!confirmPassVal)  { setError("confirmPass", "Required"); hasError = true; }

        if (hasError) return;

        // ── 2. Current password correct? ───────────────────────────────────
        if (currentPassVal !== currentUser.password) {
            setError("currentPass", "Invalid login, please try again");
            return;
        }

        // ── 3. New password length ─────────────────────────────────────────
        if (newPassVal.length < 5) {
            setError("newPass", "Password must be at least 5 characters");
            return;
        }

        // ── 4. Passwords match? ────────────────────────────────────────────
        if (newPassVal !== confirmPassVal) {
            setError("newPass",     "These passwords do not match");
            setError("confirmPass", "These passwords do not match");
            return;
        }

        // ── SUCCESS ────────────────────────────────────────────────────────
        const userIndex = allUsers.findIndex(u => u.username === currentUser.username);
        if (userIndex === -1) return;

        if (!allUsers[userIndex].originalPassword) {
            allUsers[userIndex].originalPassword = currentUser.password;
        }
        allUsers[userIndex].password        = newPassVal;
        allUsers[userIndex].passwordChanged = true;
        localStorage.setItem("allUsers", JSON.stringify(allUsers));

        currentUser.originalPassword = currentUser.originalPassword || currentUser.password;
        currentUser.password        = newPassVal;
        currentUser.passwordChanged = true;
        localStorage.setItem("currentUser", JSON.stringify(currentUser));

        document.getElementById("chgPassbx").style.display      = "none";
        document.querySelector(".success-container").style.display = "flex";
    });

    // ── Continue button ────────────────────────────────────────────────────
    document.getElementById("continueToHome").addEventListener("click", function () {
        window.location.href = "course.html";
    });

    // ── Eye icon toggle ────────────────────────────────────────────────────
    document.querySelectorAll(".iconeye").forEach(eye => {
        eye.addEventListener("mousedown", e => e.preventDefault());
        eye.addEventListener("click", function () {
            const input = this.closest(".input-wrap").querySelector("input");
            const img   = this.querySelector("img");
            if (input.type === "password") {
                input.type = "text";
                img.src    = "icon/dis.png";
            } else {
                input.type = "password";
                img.src    = "icon/ena.png";
            }
            input.focus();
        });
    });
</script>

</body>
</html>
