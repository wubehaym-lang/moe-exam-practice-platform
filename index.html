<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UT-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ministry of Education: Grade 12 - National Exam Login</title>
    <link rel="stylesheet" href="css/stylein.css">
    <link rel="icon" type="image/icon" href="icon/favicon.ico">
</head>
<body> 
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <img src="pct/logo.jpg" alt="Logo">
            </div>
             <h2 class="head">Ethiopian Secondary school Leaving Certificate Examination<br>(ESSLCE)</h2>
            <form id="loginForm">
                <input type="text" class="input" id="username" placeholder="Username" required>
                <input type="password" class="input" id="password" placeholder="Password" required>

                    <p id="msg" class="mm"></p>
                    <p id="errorText" class="mm"></p>

                <button type="button" id="loginBtn">Log in</button>
            </form>
            <div class="btm">
                <p class="footer-text">You are using : </p>
                <code class="url-text">cl.exam.et</code>
            </div>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
