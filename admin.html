<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>
    <link rel="stylesheet" href="css/main-admin.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="icon" type="image/icon" href="icon/favicon.ico">
</head>
<body>
<!-- Header + Sidebar injected by admin-logic.js -->

<main class="container">
  <div class="dashboard-container">
    <div class="header-controls">
      <h2 style="color:#2f81d3;">Student Exam Database</h2>
      <a href="register.html" class="add-btn">+ Register New Student</a>
    </div>

    <div class="stream-section">
      <div class="Tabhead">
        <h3 id="streamTitle">Natural Science</h3>
        <div class="search">
          <input type="text" placeholder="Search by ID or name" id="find">
          <icon for="find">search</icon>
        </div>
        <div>
          <button id="switchStreamBtn" type="button">Switch stream</button>
          <button id="bulkResetBtn" class="btn-delete" type="button">Reset</button>
          <button id="bulkDeleteBtn" class="btn-reset" type="button">Delete</button>
        </div>
      </div>

      <!-- Sort bar -->
      <div class="sort-bar">
        <span class="sort-label">Sort by:</span>
        <button class="sort-btn active" data-sort="name">
          <span class="sort-icon">⇅</span> Name
        </button>
        <button class="sort-btn" data-sort="id">
          <span class="sort-icon">⇅</span> ID
        </button>
        <button class="sort-btn" data-sort="passwordChanged">
          <span class="sort-icon">⇅</span> Password Changed
        </button>
        <button class="sort-btn" data-sort="live" id="sortLiveBtn">
          <span class="live-dot-sort"></span> Live Students
          <span class="live-count-badge" id="liveCountBadge">0</span>
        </button>
      </div>

      <table>
        <thead>
          <tr>
            <th><input type="checkbox" id="selectAll"></th>
            <th>ID</th>
            <th>Full Name</th>
            <th>Password Changed?</th>
            <th>Progress</th>
            <th>Password</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="studentTableBody"></tbody>
      </table>
    </div>
  </div>
</main>

<!-- Profile modal -->
<div id="profileModal" class="admin-modal-overlay" style="display:none;">
  <div class="admin-modal-content" style="max-width:760px;width:96%;">
    <h3 id="profileTitle">Student Profile</h3>
    <div id="profileBody" style="text-align:left;max-height:65vh;overflow:auto;line-height:1.6;"></div>
    <div class="modal-footer">
      <button onclick="closeProfileModal()" class="btn-secondary">Close</button>
    </div>
  </div>
</div>

<!-- Universal confirm modal -->
<div id="universalModal" class="admin-modal-overlay">
  <div class="admin-modal-content">
    <div class="lock-icon" id="modalIcon">♻️</div>
    <h3 id="universalMessage"></h3>
    <div class="modal-footer">
      <button id="universalConfirmBtn" class="btn-secondary upd">Confirm</button>
      <button onclick="closeUniversalModal()" class="btn-secondary">Cancel</button>
    </div>
  </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.2/dist/iife/sdk.js"></script>
<script src="js/appwrite-config.js"></script>
<script src="js/appwrite-sync.js"></script>
<script src="js/admin-logic.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
