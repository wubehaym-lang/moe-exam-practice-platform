<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Teacher Dashboard</title>
    <link rel="stylesheet" href="css/main-admin.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="icon" type="image/icon" href="icon/favicon.ico">
    
</head>
<body>
   <header class="admin-header">
    <div class="admin-logo-section">
        <h2>Admin Portal</h2>
    </div>
    <nav class="admin-nav">
        <a href="register.html" class="admin-link">Register Student</a>
        <a href="admin.html" class="admin-link current">Dashboard</a>
        <a href="manage_exams.html" class="admin-link">Manage Exams</a>
        <a href="#" class="admin-link" onclick="openPassModal()">Security</a> 
        <button class="admin-logout-btn" onclick="lockAdmin()">Logout</button>
    </nav>
   </header>
<main class="container">
  <div class="dashboard-container">
    <div class="header-controls">
      <h2 style="color: #2f81d3;">Student Exam Database</h2>
      <a href="register.html" class="add-btn">+ Register New Student</a>
    </div>

 <div class="stream-section">
    <div class="Tabhead">
        <h3 id="streamTitle">Natural Science</h3>

        <div class="search">
            <input type="text" placeholder="Search by ID or name" id="find">
            <icon for="find">search</icon>
        </div>
        <div>
            <button id="switchStreamBtn" type="button">Switch stream</button>
            <button id="bulkResetBtn" class="btn-delete"  type="button">Reset</button>
            <button id="bulkDeleteBtn" class="btn-reset" type="button">Delete</button>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th><input type="checkbox" id="selectAll"></th>
                <th>ID</th>
                <th>Full Name</th>
                <th>Password Changed?</th>
                <th>Progress</th>
                <th>Password</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="studentTableBody"></tbody>
    </table>
</div>


  </div>
</main>
    




<div id="profileModal" class="admin-modal-overlay" style="display:none;">
    <div class="admin-modal-content" style="max-width: 760px; width: 96%;">
        <h3 id="profileTitle">Student Profile</h3>
        <div id="profileBody" style="text-align:left; max-height: 65vh; overflow:auto; line-height:1.6;"></div>
        <div class="modal-footer">
            <button onclick="closeProfileModal()" class="btn-secondary">Close</button>
        </div>
    </div>
</div>

<div id="universalModal" class="admin-modal-overlay">
    <div class="admin-modal-content">
        <div class="lock-icon" id="modalIcon">♻️</div>
        <h3 id="universalMessage"></h3>
        <div class="modal-footer">
            <button id="universalConfirmBtn" class="btn-secondary upd">Confirm</button>
            <button onclick="closeUniversalModal()" class="btn-secondary">Cancel</button>
        </div>
    </div>
</div>

    <!-- Firebase SDK (must come first) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
<script src="js/admin-logic.js"></script>
<script>
    // ============================================================
    //  admin.html inline script  —  FIREBASE VERSION  (fixed)
    // ============================================================

    // ── Constants ─────────────────────────────────────────────
    const streamSubjects = {
        "Natural Science": ["English", "Mathematics", "Physics", "Biology", "Scholastic aptitude test", "Chemistry"],
        "Social Science":  ["English", "Mathematics", "Geography", "History", "Scholastic aptitude test", "Economics"]
    };

    let currentStream  = "Natural Science";
    let selectedUsers  = [];
    let actionType     = "";
    let allUsersCache  = {};   // { username: userObject, … }

    // ── Helper: split name ─────────────────────────────────────
    function splitUserName(fullName) {
        return (fullName || "").trim().split(/\s+/);
    }

    function getDisplayName(fullName) {
        const parts = splitUserName(fullName);
        return parts.length > 1 ? parts[0] + " " + parts[parts.length - 1] : (fullName || "");
    }

    function getSubjectTypes() {
        return ["Mock Exam"];
    }

    // ── Exam-progress helpers (reads from Firebase via cached user object) ──
    function getSubjectCompleted(username, subject) {
        const user = allUsersCache[username] || {};
        const prog = (user.examProgress || {});
        return getSubjectTypes().some(type =>
            prog[subject] && prog[subject][type] && prog[subject][type].finished === true
        );
    }

    function getSubjectProgress(username, stream) {
        const subjects = streamSubjects[stream] || [];
        const completedCount = subjects.filter(s => getSubjectCompleted(username, s)).length;
        return { completedCount, totalCount: subjects.length, subjects };
    }

    // ── Load all users from Firebase ──────────────────────────
    async function loadAllUsers() {
        try {
            const snapshot = await db.ref("users").once("value");
            allUsersCache = snapshot.exists() ? snapshot.val() : {};
        } catch (err) {
            console.error("Failed to load users:", err);
            allUsersCache = {};
        }
    }

    // ── Filter users by stream + search ──────────────────────
    function getFilteredUsers() {
        const query = (document.getElementById("find").value || "").trim().toLowerCase();
        return Object.values(allUsersCache).filter(user => {
            if (user.stream !== currentStream) return false;
            if (!query) return true;
            const name = getDisplayName(user.fullName).toLowerCase();
            return (user.username || "").toLowerCase().includes(query) || name.includes(query);
        });
    }

    // ── Render the student table ──────────────────────────────
    function renderTable() {
        const body  = document.getElementById("studentTableBody");
        const title = document.getElementById("streamTitle");
        const users = getFilteredUsers();

        title.innerText = currentStream;
        body.innerHTML  = "";
        document.getElementById("selectAll").checked = false;

        if (users.length === 0) {
            body.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:16px;">No students found.</td></tr>`;
            return;
        }

        users.forEach(user => {
            const progress     = getSubjectProgress(user.username, user.stream);
            const progressText = `${progress.completedCount}/${progress.totalCount} subjects`;

            body.innerHTML += `
                <tr>
                    <td><input type="checkbox" class="selectUser" value="${user.username}"></td>
                    <td>${user.username}</td>
                    <td>${getDisplayName(user.fullName)}</td>
                    <td>${user.passwordChanged ? "Yes" : "No"}</td>
                    <td>${progressText}</td>
                    <td>${user.password}</td>
                    <td>
                        <button class="rest"      onclick="resetStudent('${user.username}')">Reset Pass</button>
                        <button class="btn-reset" onclick="deleteStudent('${user.username}')">Delete</button>
                        <button class="rest"      onclick="openProfile('${user.username}')">Profile</button>
                    </td>
                </tr>`;
        });
    }

    // ── Load from Firebase then render ────────────────────────
    async function loadAdminTable() {
        const body = document.getElementById("studentTableBody");
        body.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:16px;">Loading…</td></tr>`;
        await loadAllUsers();
        renderTable();
    }

    function toggleStream() {
        currentStream = currentStream === "Natural Science" ? "Social Science" : "Natural Science";
        renderTable();
    }

    function getSelectedUsers() {
        return Array.from(document.querySelectorAll(".selectUser:checked")).map(cb => cb.value);
    }

    // ── Modals ────────────────────────────────────────────────
    function openUniversalModal(type, message, icon = "♻️") {
        actionType = type;
        document.getElementById("universalMessage").innerText = message;
        document.getElementById("modalIcon").innerText         = icon;
        document.getElementById("universalModal").style.display = "flex";
    }

    function closeUniversalModal() {
        document.getElementById("universalModal").style.display = "none";
        selectedUsers = [];
        actionType    = "";
    }

    function openProfile(username) {
        const user = allUsersCache[username];
        if (!user) return;

        const progress    = getSubjectProgress(username, user.stream);
        const examProgress = user.examProgress || {};

        const subjectRows = progress.subjects.map(subject => {
            const done       = getSubjectCompleted(username, subject);
            const typeData   = (examProgress[subject] && examProgress[subject]["Mock Exam"]) || {};
            const finishTime = typeData.finishTime || "—";
            return `<tr>
                <td>${subject}</td>
                <td>${done ? "Completed" : "Pending"}</td>
                <td>${finishTime}</td>
            </tr>`;
        }).join("");

        document.getElementById("profileTitle").innerText  = `${getDisplayName(user.fullName)} — Profile`;
        document.getElementById("profileBody").innerHTML   = `
            <div><strong>Full name:</strong> ${getDisplayName(user.fullName)}</div>
            <div><strong>Username:</strong> ${user.username || ""}</div>
            <div><strong>Stream:</strong> ${user.stream || ""}</div>
            <div><strong>Center:</strong> ${user.center || ""}</div>
            <div><strong>Enrollment:</strong> ${user.type || ""}</div>
            <div><strong>Deaf support:</strong> ${user.deaf || "No"}</div>
            <div><strong>Blind support:</strong> ${user.blined || "No"}</div>
            <div><strong>Password changed:</strong> ${user.passwordChanged ? "Yes" : "No"}</div>
            <div><strong>Last login:</strong> ${user.lastLogin || "—"}</div>
            <div><strong>Current login:</strong> ${user.currentLogin || "—"}</div>
            <div style="margin-top:14px;"><strong>Progress:</strong> ${progress.completedCount}/${progress.totalCount} subjects completed</div>
            <table style="width:100%;margin-top:12px;border-collapse:collapse;">
                <thead>
                    <tr>
                        <th style="text-align:left;border-bottom:1px solid #ddd;padding:6px;">Subject</th>
                        <th style="text-align:left;border-bottom:1px solid #ddd;padding:6px;">Status</th>
                        <th style="text-align:left;border-bottom:1px solid #ddd;padding:6px;">Submitted</th>
                    </tr>
                </thead>
                <tbody>${subjectRows}</tbody>
            </table>`;
        document.getElementById("profileModal").style.display = "flex";
    }

    function closeProfileModal() {
        document.getElementById("profileModal").style.display = "none";
    }

    // ── Per-student actions ───────────────────────────────────
    function deleteStudent(username) {
        selectedUsers = [username];
        openUniversalModal("delete", `Are you sure? This will permanently remove student ${username}.`, "🗑️");
    }

    function resetStudent(username) {
        selectedUsers = [username];
        openUniversalModal("resetPass", `Reset password for ${username} back to original?`, "🔑");
    }

    document.getElementById("bulkDeleteBtn").onclick = () => {
        const selected = getSelectedUsers();
        if (selected.length === 0) return alert("Select students first.");
        selectedUsers = selected;
        openUniversalModal("delete", `Permanently delete ${selected.length} selected student(s)?`, "🗑️");
    };

    document.getElementById("bulkResetBtn").onclick = () => {
        const selected = getSelectedUsers();
        if (selected.length === 0) return alert("Select students first.");
        selectedUsers = selected;
        openUniversalModal("reset", `Reset exam progress for ${selected.length} selected student(s)?`, "♻️");
    };

    // ── Firebase: clear exam progress for a user ──────────────
    async function clearUserExamData(username) {
        await db.ref("users/" + username + "/examProgress").remove();
        if (allUsersCache[username]) {
            allUsersCache[username].examProgress = {};
        }
    }

    // ── Confirm action ────────────────────────────────────────
    document.getElementById("universalConfirmBtn").onclick = async function () {
        if (selectedUsers.length === 0) return;
        const btn = this;
        btn.disabled = true;
        btn.innerText = "Working…";

        try {
            if (actionType === "delete") {
                // Remove each user from Firebase
                for (const username of selectedUsers) {
                    await db.ref("users/" + username).remove();
                    delete allUsersCache[username];
                }

            } else if (actionType === "reset") {
                // Wipe only exam progress, keep the user record intact
                for (const username of selectedUsers) {
                    await clearUserExamData(username);
                }

            } else if (actionType === "resetPass") {
                // Reset password back to the original generated password
                for (const username of selectedUsers) {
                    const user = allUsersCache[username];
                    if (!user) continue;
                    const originalPass = user.originalPassword || user.password;
                    await db.ref("users/" + username).update({
                        password:        originalPass,
                        passwordChanged: false
                    });
                    user.password        = originalPass;
                    user.passwordChanged = false;
                }
            }
        } catch (err) {
            console.error("Action failed:", err);
            alert("Failed to complete action. Check your internet connection and try again.");
        }

        btn.disabled = false;
        btn.innerText = "Confirm";
        renderTable();
        closeUniversalModal();
    };

    // ── Init ──────────────────────────────────────────────────
    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("switchStreamBtn").addEventListener("click", toggleStream);

        // Re-filter on search (no Firebase round-trip needed — data already cached)
        document.getElementById("find").addEventListener("input", renderTable);

        document.getElementById("selectAll").addEventListener("change", function () {
            document.querySelectorAll(".selectUser").forEach(cb => cb.checked = this.checked);
        });

        loadAdminTable();
    });
</script>
</body>
</html>
