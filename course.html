<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Courses</title>
    <link rel="stylesheet" href="css/mycours.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="icon" type="image/icon" href="icon/favicon.ico">
</head>
<body>

    <header class="header" id="come"></header>

    <main class="container">
        <div class="info-box">
            <div id="info-panel-container" class="info-panel"></div>
        </div>

        <div class="cardbx">
            <div class="come">
                <h1>My Exams</h1>
                <h1>Welcome, <span id="firstName"></span>! 👋</h1>
                <h3>Exam overview</h3>
            </div>

            <div class="controls-row">
                <select class="sort-select">
                    <option>All</option>
                    <option>In progress</option>
                    <option>Future</option>
                    <option>Past</option>
                </select>
                <input type="text" class="search-input" placeholder="Search" id="searchInput">
                <select class="sort-select" id="sortSelect">
                    <option>Sort by exam name</option>
                    <option>Sort by last accessed</option>
                </select>
                <select class="sort-select">
                    <option>Card</option>
                    <option>List</option>
                </select>
            </div>

            <!-- Cards are injected here by JS -->
            <div class="course-grid" id="courseGrid"></div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.2/dist/iife/sdk.js"></script>
<script src="js/appwrite-config.js"></script>
<script src="js/appwrite-sync.js"></script>
<script src="js/info.js"></script>
<script>
    loadInfoPanel();
    loadHead();
</script>
<script src="js/mycours.js"></script>

</body>
</html>
